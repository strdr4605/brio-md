# Kamal deployment config for Brio.md Landing (static site)
service: brio-landing

servers:
  web:
    - 187.127.89.56

builder:
  dockerfile: apps/landing/Dockerfile

image: strdr4605/brio-landing

env:
  clear:
    NODE_ENV: production

proxy:
  ssl: true
  host: brio.md
  app_port: 3000
  healthcheck:
    path: /
    interval: 3
    timeout: 3