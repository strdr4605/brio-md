# Kamal deployment config for Brio.md
# Shared base config

service: brio-md

# Server
servers:
  web:
    hosts:
      - 187.127.89.56

# Build locally + push to registry
builder:
  arch: amd64

# Registry (Docker Hub)
registry:
  username: strdr4605
  password:
    - KAMAL_REGISTRY_PASSWORD

# Environment variables
env:
  secret:
    - DATABASE_URL
    - AUTH_SECRET
  clear:
    NODE_ENV: production
    AUTH_TRUST_HOST: "true"

# Accessories
accessories:
  db:
    image: postgres:16-alpine
    host: 187.127.89.56
    port: 5432
    volumes:
      - /var/data/brio-md/postgres:/var/lib/postgresql/data
    env:
      clear:
        POSTGRES_USER: brio
        POSTGRES_DB: brio_md
      secret:
        - POSTGRES_PASSWORD
    options:
      "health-cmd": "pg_isready -U brio"

  drizzle:
    image: drizzleorm/drizzle-studio:latest
    host: 187.127.89.56
    port: 4990
    env:
      clear:
        DATABASE_URL: postgresql://brio@db:5432/brio_md
      secret:
        - POSTGRES_PASSWORD

volumes:
  - /var/data/brio-md/postgres:/var/lib/postgresql/data