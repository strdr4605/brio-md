# Kamal deployment config for Brio.md Learn (connects to portal DB)
service: brio-learn

servers:
  web:
    - 187.127.89.56

builder:
  dockerfile: apps/learn/Dockerfile

image: strdr4605/brio-learn

env:
  secret:
    - DATABASE_URL
    - AUTH_SECRET
    - POSTGRES_PASSWORD
  clear:
    NODE_ENV: production
    AUTH_TRUST_HOST: "true"

proxy:
  ssl: true
  host: learn.brio.md
  app_port: 3000
  healthcheck:
    path: /
    interval: 3
    timeout: 3
